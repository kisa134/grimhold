<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GRIMHOLD</title>
<style>
  html, body { margin:0; padding:0; background:#050508; overflow:hidden; font-family:Georgia,'Times New Roman',serif; color:#d8cdb4; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; display:none; z-index:2; font-family:Georgia,'Times New Roman',serif; }
  /* ---- health / stamina bars: visible dark-fantasy framing ---- */
  .statbar { position:absolute; left:26px; width:320px; height:38px; }
  .statbar .frame { position:absolute; inset:0; z-index:3; pointer-events:none;
    background:#0c0a10 url('/grimhold/assets/SPR_DarkFantasy_Bar_01_Bottom-CLuGsejZ.png') center/100% 100% no-repeat;
    border:2px solid #6a5230; border-radius:4px; box-shadow:0 0 8px #000, inset 0 0 12px rgba(0,0,0,.6); }
  .statbar .track { position:absolute; left:30px; right:30px; top:8px; bottom:8px; background:rgba(0,0,0,.6); border-radius:2px; overflow:hidden; z-index:1; }
  .statbar .fill { height:100%; width:100%; transition:width .09s linear; }
  #hpbar { bottom:28px; }
  #hpbar .fill { background:linear-gradient(#e23b38,#7a0f0f); box-shadow:inset 0 0 6px rgba(255,80,60,.7); }
  #stbar { bottom:70px; height:32px; }
  #stbar .fill { background:linear-gradient(#5fb84a,#2c5e22); box-shadow:inset 0 0 6px rgba(120,255,120,.6); }
  #weapon-icon { position:absolute; left:24px; bottom:112px; width:56px; height:56px; z-index:3; }
  #weapon-icon img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 2px 3px #000); }
  #weapon-name { position:absolute; left:88px; bottom:126px; font-size:14px; letter-spacing:1px; color:#e8c85a; text-shadow:0 0 5px #000, 0 1px 0 #000; z-index:3; }
  #slots { position:absolute; left:88px; bottom:108px; font-size:12px; color:#8d8266; text-shadow:0 0 4px #000; z-index:3; }
  #gold { position:absolute; right:26px; bottom:34px; font-size:18px; color:#e8c85a; text-shadow:0 0 6px #000, 0 1px 0 #000; font-weight:bold; z-index:3; }
  #gate-status { position:absolute; right:26px; bottom:64px; font-size:14px; letter-spacing:1px; text-shadow:0 0 6px #000, 0 1px 0 #000; z-index:3; }
  #crosshair { position:absolute; left:50%; top:50%; width:34px; height:34px; margin:-17px; z-index:3; }
  #crosshair img { width:100%; height:100%; object-fit:contain; }
  #chargering { position:absolute; left:50%; top:50%; width:34px; height:34px; margin:-17px; border-radius:50%; --chg:0; opacity:0; transition:opacity .1s;
    background:conic-gradient(#e8c85a calc(var(--chg) * 360deg), rgba(90,80,60,.22) 0deg);
    -webkit-mask:radial-gradient(circle, transparent 11px, #000 12px);
    mask:radial-gradient(circle, transparent 11px, #000 12px); }
  #dmgnums { position:absolute; inset:0; overflow:hidden; }
  .dmgnum { position:absolute; font-size:19px; font-weight:bold; text-shadow:0 0 5px #000, 0 2px 2px #000; animation:dmgfloat .85s forwards; pointer-events:none; }
  .dmgnum.white { color:#f0ead8; }
  .dmgnum.yellow { color:#ffd24d; font-size:23px; }
  .dmgnum.red { color:#ff4030; font-size:26px; }
  .dmgnum.gold { color:#ffcc33; font-size:30px; }
  .dmgnum.graze { color:#9a9a9a; font-size:14px; }
  .dmgnum.spark { color:#ffd870; font-size:17px; }
  @keyframes dmgfloat { 0%{opacity:0; transform:translate(-50%,-50%) scale(.6);} 12%{opacity:1; transform:translate(-50%,-60%) scale(1.15);} 100%{opacity:0; transform:translate(-50%,-210%) scale(.9);} }
  #killfeed { position:absolute; left:50%; top:32%; transform:translateX(-50%); text-align:center; pointer-events:none; width:700px; }
  .killpop { font-size:46px; letter-spacing:9px; font-weight:bold; font-family:Georgia,'Times New Roman',serif; text-shadow:0 0 20px currentColor, 0 3px 0 #000; animation:killpop 1.35s forwards; }
  @keyframes killpop { 0%{opacity:0; transform:scale(.35);} 14%{opacity:1; transform:scale(1.18);} 28%{transform:scale(1);} 72%{opacity:1;} 100%{opacity:0; transform:scale(1.06) translateY(-12px);} }
  #kills { position:absolute; right:24px; bottom:96px; font-size:14px; letter-spacing:2px; color:#c01222; text-shadow:0 0 6px #000; }
  #hitmarker { position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px; opacity:0; font-size:22px; color:#ffe1e1; text-align:center; line-height:26px; text-shadow:0 0 6px #a00; }
  #notify { position:absolute; left:50%; top:62%; transform:translateX(-50%); text-align:center; font-size:15px; width:600px; }
  .note { margin:2px 0; text-shadow:0 0 6px #000; animation:fadeout 2.6s forwards; }
  @keyframes fadeout { 0%{opacity:0; transform:translateY(8px);} 10%{opacity:1; transform:none;} 75%{opacity:1;} 100%{opacity:0;} }
  #prompt { position:absolute; left:50%; top:56%; transform:translateX(-50%); font-size:16px; color:#e8dcb8; text-shadow:0 0 6px #000; letter-spacing:1px; }
  #vignette { position:absolute; inset:0; box-shadow:inset 0 0 180px 60px rgba(120,0,0,0); }
  #lowhp { position:absolute; inset:0; box-shadow:inset 0 0 160px 60px rgba(150,10,10,.5); opacity:0; transition:opacity .3s; }
  #boss-name { position:absolute; left:50%; top:8%; transform:translateX(-50%); font-size:26px; letter-spacing:6px; color:#c01222; text-shadow:0 0 14px #400, 0 2px 0 #000; opacity:0; transition:opacity .4s; }
  #bloodscreen { position:absolute; inset:0; overflow:hidden; }
  #impactflash { position:absolute; inset:0; background:#fff; opacity:0; transition:opacity .06s linear; }
  .blood-drop { position:absolute; border-radius:50% 50% 55% 45%; background:radial-gradient(circle at 35% 30%, rgba(190,20,25,.85), rgba(90,4,8,.9)); filter:blur(0.6px); animation:dripfade 1.4s forwards; }
  @keyframes dripfade { 0%{opacity:1; transform:scale(.4);} 15%{opacity:1; transform:scale(1);} 70%{opacity:.8;} 100%{opacity:0; transform:translateY(14px) scale(1.1);} }
  .screen { position:fixed; inset:0; display:none; background:radial-gradient(ellipse at center,#14101a 0%,#060509 80%); z-index:10; overflow:auto; }
  .screen.active { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  h1 { font-size:58px; letter-spacing:14px; color:#b8122a; text-shadow:0 0 24px #500, 0 2px 0 #000; margin:0 0 4px; }
  h2 { color:#c9b577; letter-spacing:3px; font-weight:normal; margin:8px 0; }
  .panel { background:rgba(14,12,18,.85); border:1px solid #4a3a28; padding:14px 20px; margin:8px; max-width:960px; }
  button { pointer-events:auto; background:#241c14; color:#d8cdb4; border:1px solid #6a5230; padding:9px 16px; font-family:inherit; font-size:14px; letter-spacing:1px; cursor:pointer; margin:4px; }
  button:hover { background:#3a2c1c; border-color:#a8843f; }
  button.selected { border-color:#e8c85a; background:#3a2c1c; box-shadow:0 0 10px rgba(232,200,90,.3); }
  button.big { font-size:18px; padding:13px 34px; border-color:#a8843f; }
  input { pointer-events:auto; background:#14100c; color:#d8cdb4; border:1px solid #6a5230; padding:8px 10px; font-family:inherit; font-size:13px; margin:4px; }
  input:focus { outline:none; border-color:#a8843f; box-shadow:0 0 8px rgba(232,200,90,.25); }
  .row { display:flex; flex-wrap:wrap; justify-content:center; }
  .card { width:220px; margin:6px; padding:12px; border:1px solid #4a3a28; background:rgba(14,12,18,.85); text-align:center; }
  .card h3 { margin:4px 0; color:#e8c85a; letter-spacing:2px; }
  .small { font-size:13px; color:#9a8f78; }
  #pause-hint { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.75); color:#d8cdb4; font-size:22px; letter-spacing:3px; z-index:5; cursor:pointer; }
  #debugline { position:absolute; left:50%; bottom:132px; transform:translateX(-50%); font-size:13px; color:#9fb7cf; text-shadow:0 0 5px #000; letter-spacing:1px; opacity:.9; }
  #panel-hint { position:absolute; left:24px; top:20px; font-size:12px; color:#6a6250; text-shadow:0 0 4px #000; letter-spacing:1px; }
  /* ---- character creator ---- */
  #screen-creator { z-index:11; }
  #screen-creator.active { display:block; }
  .creator-wrap { display:flex; width:100%; height:100%; }
  .creator-left { width:470px; min-width:400px; height:100%; overflow-y:auto; padding:16px 20px 30px; background:rgba(9,7,12,.94); border-right:1px solid #3a2c1c; box-shadow:8px 0 30px rgba(0,0,0,.6); }
  .creator-right { flex:1; position:relative; background:radial-gradient(ellipse at 50% 42%, #1a1424 0%, #0a0810 55%, #050408 100%); }
  #creator-canvas { position:absolute; inset:0; width:100%; height:100%; cursor:grab; }
  #creator-canvas:active { cursor:grabbing; }
  .creator-hint { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); font-size:12px; letter-spacing:2px; color:#6a6250; text-shadow:0 0 4px #000; pointer-events:none; }
  .cr-h1 { font-size:30px; letter-spacing:8px; color:#b8122a; text-shadow:0 0 18px #500, 0 2px 0 #000; margin:4px 0 2px; }
  .cr-h2 { color:#c9b577; letter-spacing:2px; font-size:13px; margin-bottom:14px; }
  .cr-section { margin-bottom:16px; }
  .cr-title { color:#c9b577; letter-spacing:3px; font-size:12px; border-bottom:1px solid #4a3a28; padding-bottom:4px; margin-bottom:8px; }
  .cr-row { display:flex; align-items:center; justify-content:space-between; margin:2px 0; gap:4px; }
  .cr-label { color:#9a8f78; font-size:12px; letter-spacing:1px; width:132px; flex:none; }
  .cr-val { color:#e8dcb8; font-size:12px; flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cr-arrow { padding:2px 9px; font-size:12px; margin:0 1px; flex:none; }
  .cr-arrow:disabled { opacity:.35; cursor:default; }
  .cr-pool { font-size:13px; letter-spacing:2px; margin:4px 0 8px; }
  .cr-derived { background:rgba(20,16,24,.8); border:1px solid #3a2c1c; padding:8px 10px; font-size:12px; color:#9a8f78; line-height:1.7; margin-top:8px; }
  .cr-name { width:60%; font-size:15px; }
  .cr-buttons { margin-top:18px; display:flex; flex-wrap:wrap; gap:4px; }
  .cr-error { color:#ff6040; font-size:12px; margin-top:8px; min-height:16px; }
  .cr-preset.selected, .cr-weapon.selected { border-color:#e8c85a; background:#3a2c1c; box-shadow:0 0 10px rgba(232,200,90,.3); }

  /* ================= MAIN MENU (Dark Fantasy Menus style) ================= */
  #screen-main {
    background:
      radial-gradient(ellipse at 50% 40%, #3a0d14 0%, #1a0609 45%, #070305 80%);
    overflow:hidden;
  }
  #screen-main::before { /* ritual circle glow */
    content:''; position:absolute; left:50%; top:38%; width:620px; height:620px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(180,20,30,.18) 0%, rgba(120,10,18,0) 60%);
    pointer-events:none;
  }
  .mm-wrap { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; }
  .mm-emblem { width:150px; height:150px; margin-bottom:6px; filter:drop-shadow(0 0 18px rgba(180,20,30,.6)); }
  .mm-title { font-size:74px; letter-spacing:18px; color:#e9d9b0; margin:0;
    text-shadow:0 0 30px #700, 0 3px 0 #2a0608, 0 0 4px #000; font-weight:bold; }
  .mm-sub { color:#c9a14a; letter-spacing:5px; font-size:15px; margin:2px 0 26px; text-shadow:0 0 10px #000; }
  .mm-buttons { display:flex; flex-direction:column; gap:12px; align-items:center; }
  .mm-btn {
    pointer-events:auto; width:340px; padding:14px 0; font-size:18px; letter-spacing:4px;
    color:#e9d9b0; background:linear-gradient(180deg, rgba(40,20,24,.9), rgba(18,8,10,.95));
    border:2px solid #6a5230; border-radius:3px; cursor:pointer; position:relative;
    font-family:inherit; text-shadow:0 0 8px #000; transition:all .12s;
    box-shadow:0 0 0 rgba(232,200,90,0), inset 0 0 14px rgba(0,0,0,.6);
  }
  .mm-btn::before { /* gold corner ornaments */
    content:''; position:absolute; inset:4px; border:1px solid rgba(232,200,90,.25);
    pointer-events:none; border-radius:2px;
  }
  .mm-btn:hover { border-color:#e8c85a; color:#fff0c8; box-shadow:0 0 18px rgba(232,200,90,.35), inset 0 0 14px rgba(0,0,0,.5); transform:translateY(-1px); }
  .mm-btn .mk { color:#b8122a; }
  .mm-currency {
    position:absolute; top:18px; right:20px; z-index:3; display:flex; align-items:center; gap:6px;
    background:rgba(10,8,12,.8); border:1px solid #4a3a28; padding:6px 12px; border-radius:3px;
    font-size:14px; color:#e8c85a; letter-shadow:0 0 6px #000;
  }
  .mm-currency .coin { width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #7fd07f, #1f6e2a); display:inline-block; }
  .mm-foot { position:absolute; bottom:14px; left:0; right:0; text-align:center; color:#7a3a3a; font-size:11px; letter-spacing:2px; z-index:2; }

  /* ================= LOADOUT (screen 2) — single-screen grid ================= */
  #screen-loadout.menu-df {
    display:none; background:radial-gradient(ellipse at 50% 35%, #1c1322 0%, #0a0710 60%, #040308 100%);
    overflow:hidden; padding:0;
  }
  #screen-loadout.menu-df.active { display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:1fr; height:100vh; width:100vw; }
  .lo-top { display:flex; flex-direction:column; align-items:center; padding:14px 0 4px; position:relative; }
  .lo-top h1 { font-size:34px; letter-spacing:10px; color:#e9d9b0; margin:0; text-shadow:0 0 20px #700, 0 2px 0 #2a0608; }
  .lo-top h2 { color:#c9a14a; letter-spacing:3px; font-size:12px; margin:2px 0 0; }
  .lo-grid { display:grid; grid-template-columns: 1.1fr 1fr 1fr; gap:14px; padding:10px 22px; align-items:stretch; min-height:0; }
  .lo-col { display:flex; flex-direction:column; min-height:0; }
  .lo-col-title { color:#c9b577; letter-spacing:3px; font-size:12px; border-bottom:1px solid #4a3a28; padding-bottom:5px; margin-bottom:8px; text-align:center; }
  .lo-classes { display:flex; flex-direction:column; gap:8px; overflow:hidden; }
  .lo-class {
    flex:1; pointer-events:auto; text-align:left; background:rgba(14,10,16,.82); border:1px solid #4a3a28;
    border-radius:3px; padding:8px 12px; cursor:pointer; position:relative; transition:all .12s; color:#d8cdb4; font-family:inherit;
  }
  .lo-class:hover { border-color:#a8843f; background:rgba(28,20,28,.9); }
  .lo-class.selected { border-color:#e8c85a; box-shadow:0 0 12px rgba(232,200,90,.3); background:rgba(34,24,28,.92); }
  .lo-class h3 { margin:0 0 2px; color:#e8c85a; letter-spacing:2px; font-size:15px; }
  .lo-class .desc { font-size:11px; color:#9a8f78; line-height:1.3; }
  .lo-class .stats { font-size:11px; color:#b8ad95; margin-top:3px; }
  .lo-class .wpn { font-size:11px; color:#c9a14a; margin-top:2px; }
  .lo-center { align-items:center; justify-content:flex-start; }
  .lo-champ-canvas { width:100%; flex:1; min-height:0; border:2px solid #5a4630; border-radius:3px; background:radial-gradient(ellipse at 50% 40%, #181020 0%, #0a0710 70%); box-shadow:inset 0 0 30px rgba(0,0,0,.7); }
  .lo-champ-name { color:#e8c85a; font-size:16px; letter-spacing:2px; margin-top:6px; }
  .lo-champ-nav { display:flex; gap:8px; margin-top:4px; }
  .lo-stash { display:flex; flex-direction:column; gap:5px; overflow-y:auto; min-height:0; }
  .lo-eq-btn { pointer-events:auto; text-align:left; background:rgba(14,10,16,.82); border:1px solid #4a3a28; color:#cbbfa6; padding:6px 10px; font-size:12px; font-family:inherit; border-radius:3px; cursor:pointer; }
  .lo-eq-btn:hover { border-color:#a8843f; }
  .lo-eq-btn.selected { border-color:#e8c85a; color:#e8c85a; }
  .lo-eq-btn:disabled { opacity:.45; cursor:default; }
  .lo-gold { text-align:center; color:#e8c85a; font-size:15px; letter-spacing:2px; margin:6px 0; }
  .lo-bottom { display:flex; gap:12px; justify-content:center; align-items:center; padding:10px 0 16px; }
  .lo-bottom .big { font-size:17px; padding:12px 30px; }
  .lo-controls { font-size:10px; color:#6a6250; text-align:center; letter-spacing:1px; max-width:760px; margin:0 auto; line-height:1.4; }



  /* ================= DARK FANTASY CREATOR SKIN =================
     Sprites: public/assets/hud/DarkFantasy/* + Icons_Weapons/* + Icons_Stats/*
     Frames are drawn on ::before overlays so the gold tint filter never
     touches the text/controls underneath. Layout & logic untouched. */
  :root {
    --df: './assets/hud/DarkFantasy/';
    --gold:#e8c85a; --gold-dim:#a8843f; --gold-ink:#f0dfa6;
    --gild: sepia(1) saturate(3.2) hue-rotate(-14deg) brightness(1.05) contrast(1.05);
  }
  .creator-left {
    background:
      linear-gradient(rgba(9,7,12,.93), rgba(9,7,12,.97)),
      url('/grimhold/assets/SPR_DarkFantasy_Frame_Box_Large_02_Background-DMhGtCeX.png') center/cover no-repeat;
    border-right:2px solid #6a5230;
    box-shadow:8px 0 34px rgba(0,0,0,.75), inset -1px 0 0 rgba(232,200,90,.18);
  }
  .creator-left::-webkit-scrollbar { width:9px; }
  .creator-left::-webkit-scrollbar-track { background:#0b0910; }
  .creator-left::-webkit-scrollbar-thumb { background:linear-gradient(#6a5230,#3a2c1c); border:1px solid #8a6c38; }

  /* --- ornamental section panel --- */
  .cr-panel { position:relative; padding:20px 18px 16px; margin-bottom:20px; background:
      linear-gradient(rgba(18,14,22,.86), rgba(10,8,14,.92)); }
  .cr-panel::before {
    content:''; position:absolute; inset:-14px; pointer-events:none; z-index:0;
    border:26px solid transparent;
    border-image:url('/grimhold/assets/SPR_DarkFantasy_Frame_Box_Large_02-CxL4F6b0.png') 110 stretch;
    filter:var(--gild) drop-shadow(0 0 6px rgba(0,0,0,.9));
    opacity:.95;
  }
  .cr-panel > * { position:relative; z-index:1; }

  /* --- ornamental section header (banner bar) --- */
  .cr-banner { position:relative; height:34px; margin:-6px 0 12px; display:flex;
    align-items:center; justify-content:center; }
  .cr-banner::before {
    content:''; position:absolute; inset:0 -6px; z-index:0;
    background:url('/grimhold/assets/SPR_DarkFantasy_Frame_Bar_05-BDy0_3sb.png') center/100% 100% no-repeat;
    filter:var(--gild); opacity:.9;
  }
  .cr-banner .cr-title { position:relative; z-index:1; border:none; margin:0; padding:0;
    color:var(--gold-ink); letter-spacing:4px; font-size:12px;
    text-shadow:0 0 8px rgba(232,200,90,.5), 0 2px 0 #000; }

  /* --- gilded buttons (CONFIRM / RANDOMIZE / RESET / BACK / presets) --- */
  .creator-left button,
  .cr-buttons button {
    position:relative; background:linear-gradient(#2a2018,#171009);
    border:1px solid #7a5f31; color:#e0d3b0; letter-spacing:2px;
    text-shadow:0 1px 0 #000; transition:all .12s ease;
  }
  .creator-left button:hover {
    background:linear-gradient(#4a3720,#2a1d10); border-color:var(--gold);
    color:#fff3cf; box-shadow:0 0 12px rgba(232,200,90,.35), inset 0 0 10px rgba(232,200,90,.12);
  }
  .creator-left button:disabled { opacity:.32; box-shadow:none; }
  .cr-buttons { margin-top:20px; gap:6px; }
  .cr-buttons button {
    flex:1 1 40%; padding:11px 8px; font-size:13px;
    background:
      linear-gradient(rgba(30,22,12,.82), rgba(14,10,6,.9)),
      url('/grimhold/assets/SPR_DarkFantasy_Box_Hotbar_03-D_xn0syA.png') center/100% 100% no-repeat;
    border:1px solid #8a6c38;
  }
  #cr-confirm {
    flex:1 1 100%; font-size:17px; padding:14px 8px; color:#ffeaa8;
    border:2px solid var(--gold);
    background:
      linear-gradient(rgba(58,40,14,.85), rgba(24,16,6,.92)),
      url('/grimhold/assets/SPR_DarkFantasy_Frame_HotBar_01-B4_6B6_9.png') center/100% 100% no-repeat;
    box-shadow:0 0 16px rgba(232,200,90,.28), inset 0 0 18px rgba(232,200,90,.10);
    animation:crPulse 3.2s ease-in-out infinite;
  }
  #cr-confirm:hover { box-shadow:0 0 26px rgba(232,200,90,.55), inset 0 0 22px rgba(232,200,90,.2); }
  @keyframes crPulse { 0%,100%{ border-color:#a8843f; } 50%{ border-color:#ffe08a; } }

  /* --- ORIGIN / archetype chips --- */
  .cr-preset {
    padding:8px 13px; font-size:12px;
    background:linear-gradient(#241a10,#120c07) !important;
  }
  .cr-preset.selected {
    border-color:var(--gold) !important; color:#ffeaa8 !important;
    box-shadow:0 0 14px rgba(232,200,90,.45), inset 0 0 12px rgba(232,200,90,.15) !important;
  }

  /* --- ◀ ▶ / +- arrows as small gilded studs --- */
  .cr-arrow { padding:3px 10px; font-size:12px; border-radius:2px;
    background:linear-gradient(#2c2116,#150e08) !important; border:1px solid #6a5230 !important; }
  .cr-arrow:hover:not(:disabled) { border-color:var(--gold) !important; color:#ffeaa8 !important; }

  /* --- appearance rows framed like inventory bars --- */
